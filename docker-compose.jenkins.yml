services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      # Eveything what jenkins does is saved on local machine
      - ./docker/jenkins:/var/jenkins_home
      # Direct communication with the Docker Daemon's host
      - /var/run/docker.sock:/var/run/docker.sock
      # Add pipeline settings when jenkins builds
      - ./docker/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dhudson.model.DirectoryBrowserSupport.CSP=\"\" -Djenkins.install.runSetupWizard=false"