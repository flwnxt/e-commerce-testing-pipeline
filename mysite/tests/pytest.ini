# tests/pytest.ini
# =============================================================================
# Pytest settings for LearnHub test suite
# =============================================================================

[pytest]
# Test file discovery pattern
testpaths = tests/e2e/tests
# fix the the problem when reading pytest_dark_mode from development branch
; pythonpath = .
# Fix the problem when report.html cannot be read
# Default command-line options:
#   -v           : verbose output (shows each test name)
#   --tb=short   : shorter tracebacks on failure
addopts = -v --tb=short --output=/tmp/playwright-artifacts --html=report.html --css=pytest_dark_mode.css --import-mode=importlib

# Only collect files matching this pattern
python_files = test_*.py

# Only collect classes matching this pattern
python_classes = Test*

# Only collect functions matching this pattern
python_functions = test_*


